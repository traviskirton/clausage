name: ClaudeUsage
options:
  bundleIdPrefix: com.postfl
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
attributes:
  LastUpgradeCheck: "2700"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G3GED29J33
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.4"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's "recommended settings" (adopted here because the .xcodeproj is generated)
    DEAD_CODE_STRIPPING: YES
    REGISTER_APP_GROUPS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [App, Shared, Resources, design/clausage-icon.icon]
    settings:
      base:
        PRODUCT_NAME: Claude Usage
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.claude-usage
        ASSETCATALOG_COMPILER_APPICON_NAME: clausage-icon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: App/Info.plist
      properties:
        # Display name only: the bundle stays "Claude Usage.app" with the same IDs (build, release, Sparkle, login item).
        CFBundleName: Clausage
        CFBundleDisplayName: Clausage
        SUFeedURL: https://updates.postfl.com/claude-usage/appcast.xml
        SUPublicEDKey: hZIfbhuLEa1k5VbIA5whEo3xOS1xzTdno5TYCDysRf0=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
    entitlements:
      path: App/ClaudeUsage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.postfl.claude-usage-spks
          - com.postfl.claude-usage-spki
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [G3GED29J33.com.postfl.claude-usage]
    dependencies:
      - target: ClaudeUsageWidget
        embed: true
      - package: Sparkle
      - package: KeyboardShortcuts
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared, SharedUI]
    settings:
      base:
        PRODUCT_NAME: ClaudeUsageWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.claude-usage.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [G3GED29J33.com.postfl.claude-usage]
  ClaudeUsageiOS:
    type: application
    platform: iOS
    sources: [iOS/App, iOS/Shared, Shared, SharedUI, design/clausage-icon.icon]
    settings:
      base:
        PRODUCT_NAME: Claude Usage
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.claude-usage-ios
        ASSETCATALOG_COMPILER_APPICON_NAME: clausage-icon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.postfl.claude-usage-ios.refresh]
        UIBackgroundModes: [fetch]
    entitlements:
      path: iOS/App/ClaudeUsageiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.postfl.claude-usage]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.postfl.claude-usage-ios.shared"]
    dependencies:
      - target: ClaudeUsageWidgetiOS
        embed: true
  ClaudeUsageWidgetiOS:
    type: app-extension
    platform: iOS
    sources: [iOS/Widget, iOS/Shared, Shared, SharedUI]
    settings:
      base:
        PRODUCT_NAME: ClaudeUsageWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.claude-usage-ios.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
    info:
      path: iOS/Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget/ClaudeUsageWidgetiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.postfl.claude-usage]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.postfl.claude-usage-ios.shared"]
  ClausageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Models.swift
      - Shared/UsageClient.swift
      - Shared/WeeklyHistory.swift
      - Shared/Forecast.swift
      - App/ContributorsScan.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.claude-usage.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClausageTests:
    build:
      targets:
        ClausageTests: [test]
    test:
      targets: [ClausageTests]
  ClaudeUsage:
    build:
      targets:
        ClaudeUsage: all
  ClaudeUsageiOS:
    build:
      targets:
        ClaudeUsageiOS: all
