name: Clausage
options:
  bundleIdPrefix: com.postfl
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
attributes:
  LastUpgradeCheck: "2700"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G3GED29J33
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.0.5"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's "recommended settings" (adopted here because the .xcodeproj is generated)
    DEAD_CODE_STRIPPING: YES
    REGISTER_APP_GROUPS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Clausage:
    type: application
    platform: macOS
    sources: [App, Shared, Resources, design/clausage-icon.icon]
    settings:
      base:
        PRODUCT_NAME: Clausage
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.clausage
        ASSETCATALOG_COMPILER_APPICON_NAME: clausage-icon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Clausage
        CFBundleDisplayName: Clausage
        SUFeedURL: https://clausage.ai/updates/appcast.xml
        SUPublicEDKey: hZIfbhuLEa1k5VbIA5whEo3xOS1xzTdno5TYCDysRf0=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
    entitlements:
      path: App/Clausage.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.postfl.clausage-spks
          - com.postfl.clausage-spki
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [G3GED29J33.com.postfl.clausage]
    dependencies:
      - target: ClausageWidget
        embed: true
      - package: Sparkle
      - package: KeyboardShortcuts
  ClausageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared, SharedUI]
    settings:
      base:
        PRODUCT_NAME: ClausageWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.clausage.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClausageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [G3GED29J33.com.postfl.clausage]
  ClausageiOS:
    type: application
    platform: iOS
    sources: [iOS/App, iOS/Shared, Shared, SharedUI, design/clausage-icon.icon]
    settings:
      base:
        PRODUCT_NAME: Clausage
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.clausage-ios
        ASSETCATALOG_COMPILER_APPICON_NAME: clausage-icon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.postfl.clausage-ios.refresh]
        UIBackgroundModes: [fetch]
    entitlements:
      path: iOS/App/ClausageiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.postfl.clausage]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.postfl.clausage-ios.shared"]
    dependencies:
      - target: ClausageWidgetiOS
        embed: true
  ClausageWidgetiOS:
    type: app-extension
    platform: iOS
    sources: [iOS/Widget, iOS/Shared, Shared, SharedUI]
    settings:
      base:
        PRODUCT_NAME: ClausageWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.clausage-ios.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clausage
    info:
      path: iOS/Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget/ClausageWidgetiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.postfl.clausage]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.postfl.clausage-ios.shared"]
  ClausageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Models.swift
      - Shared/UsageClient.swift
      - Shared/WeeklyHistory.swift
      - Shared/Forecast.swift
      - App/ContributorsScan.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postfl.clausage.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClausageTests:
    build:
      targets:
        ClausageTests: [test]
    test:
      targets: [ClausageTests]
  Clausage:
    build:
      targets:
        Clausage: all
  ClausageiOS:
    build:
      targets:
        ClausageiOS: all
